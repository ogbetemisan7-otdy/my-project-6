<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Temi🤍 Stores</title>
    <link rel="stylesheet" href="assests/css/styles.css">
</head>
<body>

    <header>
        <div class="logo">✨ Temi🤍 Stores</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#products">Products</a>
            <a href="index.html#about">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <a class="product-button" href="index.html">Back to Shop</a>
    </header>

    <div class="contact-container">
        <h1>Contact Us</h1>
        <p>Fill in the form below to ask about your chosen product.</p>

        <form action="#" method="get">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="product">Product:</label>
            <input type="text" id="product" name="product"
                   placeholder="Enter product name" required>

            <label for="message">Your Message:</label>
            <textarea id="message" name="message"
                      placeholder="Write your message here..."
                      required></textarea>

            <button type="submit">Send Message</button>

        </form>
    </div>
    <footer>
        <p>&copy; 2026 Temi🤍 Stores. All rights reserved.</p>
    </footer>
</body>
</html>
